<div class="game-window">
  <canvas #canvas></canvas>

  @if (this.tileDetails()) {
    <div class="tile-info">
      @for (item of this.tileDetails() | keyvalue; track item.key) {
        @if (item.key !== 'base.corners') {
          <p>{{ item.key }}: {{ item.value }}</p>
        }
      }
    </div>
  }

  <div class="map-types">
    @for (mapType of this.mapTypes; track $index) {
      <div>
        <button></button>
      </div>
    }
  </div>
</div>
